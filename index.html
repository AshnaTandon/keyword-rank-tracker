<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keyword Rank Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fc;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 30px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    .logo {
      font-size: 23px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 25px rgba(15, 23, 42, 0.07);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .description {
      color: #64748b;
      margin-bottom: 25px;
    }

    label.title {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .counter {
      text-align: right;
      color: #64748b;
      font-size: 13px;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .locations {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .location {
      position: relative;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .location:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .location input {
      position: absolute;
      opacity: 0;
    }

    .location input:checked + .location-content {
      color: #1d4ed8;
    }

    .location:has(input:checked) {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .location-name {
      font-size: 16px;
      font-weight: 700;
    }

    .location-country {
      color: #64748b;
      font-size: 13px;
      margin-top: 5px;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .check-button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
    }

    .check-button:hover {
      background: #1d4ed8;
    }

    .check-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .progress-box {
      display: none;
      margin-top: 25px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #2563eb;
      transition: width 0.3s;
    }

    .results-card {
      display: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .summary-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 18px;
    }

    .summary-number {
      font-size: 25px;
      font-weight: 700;
    }

    .summary-label {
      color: #64748b;
      font-size: 13px;
      margin-top: 5px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #f8fafc;
      text-align: left;
      padding: 14px;
      font-size: 13px;
      color: #475569;
    }

    td {
      padding: 15px 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .rank {
      font-weight: 700;
      color: #2563eb;
    }

    .not-found {
      color: #94a3b8;
    }

    .location-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .empty-message {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .locations {
        grid-template-columns: 1fr;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">🔎 Keyword Rank Tracker</div>
      <div class="subtitle">
        Track Google rankings by city and country
      </div>
    </div>
  </header>

  <main class="container">

    <div class="card">

      <h2>Check Google Rankings</h2>

      <div class="description">
        Enter your website and keywords, then choose one location.
      </div>

      <label class="title">Website / Domain</label>

      <input
        type="text"
        id="website"
        placeholder="example.com"
      >

      <br><br>

      <label class="title">Keywords</label>

      <textarea
        id="keywords"
        placeholder="seo agency&#10;seo company&#10;digital marketing&#10;web design"
        oninput="updateKeywordCount()"
      ></textarea>

      <div class="counter">
        <span id="keywordCount">0</span> keywords
      </div>

      <label class="title">Ranking Location</label>

      <div class="locations">

        <label class="location">
          <input
            type="radio"
            name="location"
            value="Toronto, Canada"
          >

          <div class="location-content">
            <div class="location-name">
              🇨🇦 Toronto
            </div>

            <div class="location-country">
              Canada
            </div>
          </div>
        </label>

        <label class="location">
          <input
            type="radio"
            name="location"
            value="Dubai, UAE"
          >

          <div class="location-content">
            <div class="location-name">
              🇦🇪 Dubai
            </div>

            <div class="location-country">
              United Arab Emirates
            </div>
          </div>
        </label>

        <label class="location">
          <input
            type="radio"
            name="location"
            value="New York, USA"
          >

          <div class="location-content">
            <div class="location-name">
              🇺🇸 New York
            </div>

            <div class="location-country">
              United States
            </div>
          </div>
        </label>

      </div>

      <div class="settings">

        <div>
          <label class="title">Device</label>

          <select id="device">
            <option value="Desktop">Desktop</option>
            <option value="Mobile">Mobile</option>
          </select>
        </div>

        <div>
          <label class="title">Results to check</label>

          <select id="depth">
            <option value="10">Top 10</option>
            <option value="20">Top 20</option>
            <option value="50">Top 50</option>
            <option value="100" selected>Top 100</option>
          </select>
        </div>

      </div>

      <button
        class="check-button"
        id="checkButton"
        onclick="startCheck()"
      >
        Check Rankings
      </button>

      <div class="progress-box" id="progressBox">

        <div class="progress-text">
          <span id="progressMessage">
            Preparing ranking check...
          </span>

          <span id="progressCount">
            0/0
          </span>
        </div>

        <div class="progress">
          <div
            class="progress-bar"
            id="progressBar"
          ></div>
        </div>

      </div>

    </div>


    <div class="card results-card" id="resultsCard">

      <h2>Ranking Results</h2>

      <div class="description" id="resultLocation">
      </div>

      <div class="summary">

        <div class="summary-box">
          <div
            class="summary-number"
            id="totalKeywords"
          >
            0
          </div>

          <div class="summary-label">
            Keywords
          </div>
        </div>

        <div class="summary-box">
          <div
            class="summary-number"
            id="rankingKeywords"
          >
            0
          </div>

          <div class="summary-label">
            Ranking Keywords
          </div>
        </div>

        <div class="summary-box">
          <div
            class="summary-number"
            id="notRankingKeywords"
          >
            0
          </div>

          <div class="summary-label">
            Not Found
          </div>
        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Keyword</th>
              <th>Location</th>
              <th>Position</th>
              <th>Page</th>
              <th>Ranking URL</th>
            </tr>

          </thead>

          <tbody id="resultsBody">

          </tbody>

        </table>

      </div>

    </div>

  </main>


  <script>

    function updateKeywordCount() {

      const text =
        document.getElementById("keywords").value;

      const keywords = text
        .split("\n")
        .map(k => k.trim())
        .filter(k => k.length > 0);

      document.getElementById("keywordCount").textContent =
        keywords.length;
    }


    async function startCheck() {

      const website =
        document.getElementById("website").value.trim();

      const keywordText =
        document.getElementById("keywords").value.trim();

      const locationElement =
        document.querySelector(
          'input[name="location"]:checked'
        );

      const device =
        document.getElementById("device").value;

      const depth =
        Number(document.getElementById("depth").value);


      if (!website) {
        alert("Please enter your website.");
        return;
      }


      if (!keywordText) {
        alert("Please enter at least one keyword.");
        return;
      }


      if (!locationElement) {
        alert("Please select one location.");
        return;
      }


      const keywords =
        keywordText
          .split("\n")
          .map(k => k.trim())
          .filter(k => k.length > 0);


      if (keywords.length > 100) {
        alert(
          "The current version supports up to 100 keywords."
        );
        return;
      }


      const location =
        locationElement.value;


      const button =
        document.getElementById("checkButton");

      const progressBox =
        document.getElementById("progressBox");

      const progressBar =
        document.getElementById("progressBar");

      const progressMessage =
        document.getElementById("progressMessage");

      const progressCount =
        document.getElementById("progressCount");

      const resultsCard =
        document.getElementById("resultsCard");

      const resultsBody =
        document.getElementById("resultsBody");


      button.disabled = true;

      button.textContent =
        "Checking Rankings...";


      progressBox.style.display =
        "block";


      resultsCard.style.display =
        "block";


      resultsBody.innerHTML =
        "";


      document.getElementById(
        "resultLocation"
      ).innerHTML =
        `Location: <span class="location-badge">${location}</span> · ${device}`;


      document.getElementById(
        "totalKeywords"
      ).textContent =
        keywords.length;


      let rankingCount = 0;

      let notFoundCount = 0;


      for (
        let i = 0;
        i < keywords.length;
        i++
      ) {

        const keyword =
          keywords[i];


        const percentage =
          Math.round(
            ((i + 1) / keywords.length) * 100
          );


        progressBar.style.width =
          percentage + "%";


        progressCount.textContent =
          `${i + 1}/${keywords.length}`;


        progressMessage.textContent =
          `Checking "${keyword}" in ${location}...`;


        try {

          const response =
            await fetch("/api/rank-check", {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                website,
                keyword,
                location,
                device,
                depth
              })

            });


          const data =
            await response.json();


          if (
            data.success &&
            data.data &&
            data.data.found
          ) {

            rankingCount++;

            addResultRow(
              keyword,
              location,
              data.data.position,
              data.data.page,
              data.data.ranking_url
            );

          } else {

            notFoundCount++;

            addResultRow(
              keyword,
              location,
              null,
              null,
              null
            );

          }

        } catch (error) {

          notFoundCount++;

          addResultRow(
            keyword,
            location,
            null,
            null,
            null
          );

        }


        document.getElementById(
          "rankingKeywords"
        ).textContent =
          rankingCount;


        document.getElementById(
          "notRankingKeywords"
        ).textContent =
          notFoundCount;


        /*
          Small delay between requests.
          This is only for the MVP UI/backend test.
        */

        if (i < keywords.length - 1) {

          await new Promise(
            resolve => setTimeout(resolve, 300)
          );

        }

      }


      progressBar.style.width =
        "100%";


      progressMessage.textContent =
        "Ranking check completed";


      button.disabled =
        false;


      button.textContent =
        "Check Rankings";

    }


    function addResultRow(
      keyword,
      location,
      position,
      page,
      url
    ) {

      const tbody =
        document.getElementById("resultsBody");


      const row =
        document.createElement("tr");


      let positionHTML =
        '<span class="not-found">—</span>';

      let pageHTML =
        '<span class="not-found">—</span>';

      let urlHTML =
        '<span class="not-found">Not found</span>';


      if (position !== null) {

        positionHTML =
          `<span class="rank">#${position}</span>`;

        pageHTML =
          page;

        urlHTML =
          `<a href="${url}" target="_blank" rel="noopener noreferrer">
            View URL
          </a>`;

      }


      row.innerHTML = `

        <td>
          <strong>${escapeHTML(keyword)}</strong>
        </td>

        <td>
          <span class="location-badge">
            ${escapeHTML(location)}
          </span>
        </td>

        <td>
          ${positionHTML}
        </td>

        <td>
          ${pageHTML}
        </td>

        <td>
          ${urlHTML}
        </td>

      `;


      tbody.appendChild(row);

    }


    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
