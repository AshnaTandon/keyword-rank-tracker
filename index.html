<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyword Rank Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 40px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .locations {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .location {
      border: 2px solid #e5e7eb;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .location:hover {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 700px) {
      .locations {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔎 Keyword Rank Tracker</h1>
  </div>

  <div class="container">

    <div class="card">
      <h2>Check Google Rankings</h2>
      <p>Track your website rankings by country and city.</p>

      <label>Website / Domain</label>
      <input
        type="text"
        id="website"
        placeholder="example.com"
      >

      <label>Keywords</label>
      <textarea
        id="keywords"
        placeholder="seo agency&#10;seo company&#10;digital marketing"
      ></textarea>

      <label>Locations</label>

      <div class="locations">

  <label class="location">
    <input type="radio" name="location" value="Toronto, Canada">
    🇨🇦 Toronto, Canada
  </label>

  <label class="location">
    <input type="radio" name="location" value="Dubai, UAE">
    🇦🇪 Dubai, UAE
  </label>

  <label class="location">
    <input type="radio" name="location" value="New York, USA">
    🇺🇸 New York, USA
  </label>

</div>


      <br>

      <label>Device</label>
      <select id="device">
        <option>Desktop</option>
        <option>Mobile</option>
      </select>

      <button onclick="startCheck()">
        Check Rankings
      </button>

      <div class="result" id="result"></div>

    </div>

  </div>

  <script>
    async function startCheck() {

  const website = document.getElementById("website").value.trim();
  const keywords = document.getElementById("keywords").value.trim();
  const locationElement = document.querySelector(
    'input[name="location"]:checked'
  );
  const device = document.getElementById("device").value;

  if (!website) {
    alert("Please enter your website.");
    return;
  }

  if (!keywords) {
    alert("Please enter at least one keyword.");
    return;
  }

  if (!locationElement) {
    alert("Please select one location.");
    return;
  }

  const location = locationElement.value;

  const keywordList = keywords
    .split("\n")
    .map(keyword => keyword.trim())
    .filter(keyword => keyword.length > 0);

  const result = document.getElementById("result");

  result.style.display = "block";
  result.innerHTML = "⏳ Sending ranking request...";

  try {

    const response = await fetch("/api/rank-check", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        website,
        keyword: keywordList[0],
        location,
        device
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Something went wrong");
    }

    result.innerHTML = `
      <strong>✅ Request received</strong><br><br>

      Website: ${data.data.website}<br>
      Keyword: ${data.data.keyword}<br>
      Location: ${data.data.location}<br>
      Device: ${data.data.device}<br><br>

      ⏳ Real Google ranking engine will be connected next.
    `;

  } catch (error) {

    result.innerHTML = `
      ❌ Error: ${error.message}
    `;

  }
}


  </script>

</body>
</html>
