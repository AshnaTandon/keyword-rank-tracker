<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Keyword Rank Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #667085;
    }

    .card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #4f46e5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .keywords {
      margin-top: 18px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      font-family: monospace;
    }

    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .status.info {
      display: block;
      background: #eef4ff;
      color: #175cd3;
    }

    .status.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .status.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #eaecf0;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
      color: #475467;
    }

    .rank {
      font-weight: 700;
      color: #4f46e5;
    }

    .not-found {
      color: #b42318;
      font-weight: 600;
    }

    .url {
      max-width: 350px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .container {
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Keyword Rank Tracker</h1>
    <p>Check Google organic rankings by keyword and location.</p>
  </div>

  <div class="card">

    <div class="row">

      <div>
        <label for="website">
          Website / Domain
        </label>

        <input
          id="website"
          type="text"
          placeholder="example.com"
        />
      </div>

      <div>
        <label for="location">
          Google Location
        </label>

        <select id="location">

          <option value="Toronto, Canada">
            Toronto, Canada
          </option>

          <option value="Dubai, UAE">
            Dubai, UAE
          </option>

          <option value="New York, USA">
            New York, USA
          </option>

        </select>
      </div>

    </div>

    <div class="row">

      <div>
        <label for="device">
          Device
        </label>

        <select id="device">
          <option value="Desktop">
            Desktop
          </option>

          <option value="Mobile">
            Mobile
          </option>
        </select>
      </div>

      <div>
        <label for="depth">
          Results to check
        </label>

        <select id="depth">

          <option value="100">
            Top 100
          </option>

          <option value="50">
            Top 50
          </option>

          <option value="30">
            Top 30
          </option>

        </select>
      </div>

    </div>

    <div class="keywords">

      <label for="keywords">
        Keywords
      </label>

      <textarea
        id="keywords"
        placeholder="seo agency Toronto
seo company Toronto
digital marketing Toronto
web design Toronto"
      ></textarea>

    </div>

    <button id="checkBtn">
      Check Rankings
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="card">

    <h2>Ranking Results</h2>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Keyword</th>
            <th>Location</th>
            <th>Rank</th>
            <th>Page</th>
            <th>Position on Page</th>
            <th>Ranking URL</th>
          </tr>

        </thead>

        <tbody id="resultsBody">

          <tr>
            <td colspan="6">
              No results yet.
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<script>

  const checkBtn =
    document.getElementById("checkBtn");

  const status =
    document.getElementById("status");

  const resultsBody =
    document.getElementById("resultsBody");


  function showStatus(message, type) {

    status.textContent = message;

    status.className =
      "status " + type;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function checkKeyword(
    website,
    keyword,
    location,
    device,
    depth
  ) {

    const response =
      await fetch("/api/rank-check", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          website,
          keyword,
          location,
          device,
          depth

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Rank check failed"
      );

    }


    return data;

  }


  checkBtn.addEventListener(
    "click",
    async function () {

      const website =
        document
          .getElementById("website")
          .value
          .trim();


      const location =
        document
          .getElementById("location")
          .value;


      const device =
        document
          .getElementById("device")
          .value;


      const depth =
        Number(
          document
            .getElementById("depth")
            .value
        );


      const keywords =
        document
          .getElementById("keywords")
          .value
          .split("\n")
          .map(k => k.trim())
          .filter(Boolean);


      if (!website) {

        showStatus(
          "Please enter your website/domain.",
          "error"
        );

        return;

      }


      if (!keywords.length) {

        showStatus(
          "Please enter at least one keyword.",
          "error"
        );

        return;

      }


      if (keywords.length > 100) {

        showStatus(
          "Maximum 100 keywords allowed.",
          "error"
        );

        return;

      }


      checkBtn.disabled = true;

      resultsBody.innerHTML = "";

      showStatus(
        `Checking ${keywords.length} keyword(s) in ${location}...`,
        "info"
      );


      let completed = 0;


      for (const keyword of keywords) {

        try {

          const result =
            await checkKeyword(
              website,
              keyword,
              location,
              device,
              depth
            );


          completed++;


          const row =
            document.createElement("tr");


          if (result.found) {

            row.innerHTML = `

              <td>
                ${escapeHtml(result.keyword)}
              </td>

              <td>
                ${escapeHtml(result.location)}
              </td>

              <td class="rank">
                #${escapeHtml(result.position)}
              </td>

              <td>
                ${escapeHtml(result.page)}
              </td>

              <td>
                #${escapeHtml(
                  result.position_on_page
                )}
              </td>

              <td class="url">
                ${escapeHtml(
                  result.ranking_url
                )}
              </td>

            `;

          } else {

            row.innerHTML = `

              <td>
                ${escapeHtml(result.keyword)}
              </td>

              <td>
                ${escapeHtml(result.location)}
              </td>

              <td class="not-found">
                Not in Top ${depth}
              </td>

              <td>-</td>

              <td>-</td>

              <td>-</td>

            `;

          }


          resultsBody.appendChild(row);


          showStatus(
            `Checked ${completed} of ${keywords.length} keywords...`,
            "info"
          );


        } catch (error) {

          const row =
            document.createElement("tr");


          row.innerHTML = `

            <td>
              ${escapeHtml(keyword)}
            </td>

            <td>
              ${escapeHtml(location)}
            </td>

            <td class="not-found">
              Error
            </td>

            <td colspan="3">
              ${escapeHtml(
                error.message
              )}
            </td>

          `;


          resultsBody.appendChild(row);

        }

      }


      checkBtn.disabled = false;


      showStatus(
        `Finished checking ${completed} of ${keywords.length} keywords.`,
        "success"
      );

    }

  );

</script>

</body>
</html>
